# Runs Visiblaze credential detection on this repository's own runner.
#
# Copy into .github/workflows/. Two values are yours to fill in: the action SHA you are pinning,
# and `api-url`.
#
# api-url is ENVIRONMENT-SPECIFIC and there is deliberately no default. It decides which Visiblaze
# account your findings are sent to, and a wrong one sends them somewhere you did not intend — so
# it is a placeholder here rather than a value that happens to work for whoever wrote the example.
# Your Visiblaze console shows the endpoint for your environment.
#
# The action refuses any origin not listed in its pins.env, so a typo fails the step rather than
# quietly posting to the wrong place.
#
# WHAT TO EXPECT ON THE TESTBED, MEASURED against rule pack v0.2.1 (15 rules) — not predicted:
#
#   3 findings, all CRITICAL
#     README.md:22               aws-access-key-id       (AWS's own published example key)
#     config/settings.json:6     aws-access-key-id
#     config/settings.json:7     aws-secret-access-key
#
# 4 would mean the generic/provider overlap collapse regressed — settings.json:7 matches both
# `aws-secret-access-key` and the generic `vsc-generic-api-key`, and reporting both counts one
# credential twice at two severities. 2 would mean a provider rule stopped firing.
name: Visiblaze secrets

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Scan and print what would be sent, upload nothing.'
        required: false
        default: 'true'
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Short-lived GitHub OIDC instead of a stored Visiblaze key. Nothing to rotate, nothing to
      # leak from repository secrets. The audience is bound to the credential ingest route, so
      # this token cannot be replayed against another Visiblaze endpoint.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan for committed credentials
        # Pinned by COMMIT SHA, not a tag. A tag can be moved to point at different code; a SHA
        # cannot, so the code running beside this repository cannot change without this line
        # changing.
        uses: Visiblaze/visiblaze-secret-scan@REPLACE_WITH_COMMIT_SHA
        with:
          tenant: <your-tenant-id>
          api-url: https://<your-visiblaze-endpoint>/v1/code/secrets
          # Default true on manual runs so the first execution can be read before it writes.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
          # Deliberately NOT set on first rollout. Turn on only once the findings have been read
          # and the known ones dealt with — a scanner that starts by breaking every build gets
          # switched off, not fixed.
          # fail-on: critical
