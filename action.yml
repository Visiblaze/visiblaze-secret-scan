# Visiblaze secret scan — finds credentials committed to a repository, on your own runner.
#
# ── What leaves your runner ──
#
# Rule id, severity, file path, line number, and a REDACTED, length-bounded fragment of the
# matching line. Never the credential. Never the file. Never the repository.
#
# That is not a policy statement about what we promise to discard — the detection runs here, and
# the value is masked before it is placed in any structure that is later serialised, logged or
# transmitted.
#
# Masking is a property of the LINE, not of one finding: every secret detected anywhere on a line
# is masked in every finding reporting it, so two credentials sharing a line cannot leak each
# other. Redaction used to be per-match, and each finding shipped the other's secret in full.
# The residual is a credential type no rule detects, which is why the fragment is bounded rather
# than being the whole line. For every other analysis Visiblaze fetches a tarball and scans it centrally; for
# credentials that is the least defensible version of the same design, because the artefact being
# copied IS the key.
#
# ── What this costs you ──
#
# One scanner download (~9 MB), cosign to verify its signature, and a pass over your text files.
# No third-party scanner — see pins.env.
name: Visiblaze secret scan
description: Detect credentials committed to this repository. Detection runs on your runner; only redacted findings are sent.
author: Visiblaze

inputs:
  tenant:
    description: Visiblaze tenant id the findings belong to.
    required: true
  api-url:
    description: Full Visiblaze ingest endpoint for credential findings.
    required: true
  repo-key:
    description: Repository key, "<provider>#<external_id>". Derived from the GitHub context when empty.
    required: false
    default: ''
  path:
    description: Directory to scan, relative to the checkout.
    required: false
    default: '.'
  scope:
    description: Comma-separated repository-relative paths this run covers. Empty means the whole repository.
    required: false
    default: ''
  fail-on:
    description: Fail the step when a finding is at or above this severity (critical|high|medium|low). Empty never fails on findings.
    required: false
    default: ''
  fail-on-new:
    description: >-
      Fail the step only for credentials this change INTRODUCED, at or above this severity
      (critical|high|medium|low). Prefer this over fail-on: a flat bar counts every credential the
      branch already had, so on a repository with any inherited finding it means "always fail" and
      blocks authors for something they did not commit. Needs a merge base, which this action
      supplies on a pull request. With no trustworthy baseline nothing can be called new, so the
      gate reports that it could not run rather than passing or failing silently — read
      blocking-skipped-reason.
    required: false
    default: ''
  fail-on-error:
    description: Fail the step if the scan itself could not run. Default false, so an outage on our side does not break your build.
    required: false
    default: 'false'
  dry-run:
    description: Scan and print what would be sent, upload nothing.
    required: false
    default: 'false'
  sarif-output:
    description: >-
      Also write the findings as a SARIF 2.1.0 file at this path (relative to the workspace), for
      github/codeql-action/upload-sarif or any other SARIF reader. It says where each credential is
      and which rule matched; the credential itself is never written. Empty (the default) writes nothing.
    required: false
    default: ''

outputs:
  status:
    description: >-
      complete | failed

      Frozen as-is, because workflows branch on it today. Note that `complete` is this action's
      spelling alone: `visiblaze-sast` answers the same question with `sent` | `dry-run` |
      `failed`. Use `delivery-status` for anything that must read the same on every Visiblaze
      step. `complete` also does not distinguish a real upload from a dry run — `delivery-status`
      does.
    value: ${{ steps.scan.outputs.status }}
  delivery-status:
    description: >-
      The SAME question as `status` — did this run deliver its result — in the vocabulary every
      Visiblaze action answers it in, so one `if:` expression works across all of them.

      `sent` | `dry-run` | `failed`, plus `partial` from actions that can deliver part of a run
      (this one cannot; it is listed so a consumer matching the full set does not have to be
      rewritten when another step in the same workflow emits it).

      Where `status` says `complete` this says `sent`, or `dry-run` when nothing was uploaded —
      the distinction `status` cannot make.
    value: ${{ steps.scan.outputs.delivery-status }}
  policy:
    description: >-
      `pass` | `fail` | `not-applied` — the verdict of `fail-on`, in the same three values and
      with the same meanings `visiblaze-sast` publishes.

      `fail`: a finding at or above `fail-on` is present and the step exited 2. `pass`: `fail-on`
      was set, was evaluated, and was not met. `not-applied`: no `fail-on` was given, so nothing
      was gated on.

      EMPTY when the scan did not produce a verdict at all — it could not run, or it failed before
      the policy was evaluated. Read `status` first: an empty string is not a pass. This matches
      `visiblaze-sast`, which also leaves `policy` unwritten on its failure paths.
    value: ${{ steps.scan.outputs.policy }}
  findings:
    description: Number of credential findings detected. Empty if the scan did not run — check `status` before treating it as a number.
    value: ${{ steps.scan.outputs.findings }}
  actionable:
    description: Findings not downgraded as test code. This is the number a policy acts on.
    value: ${{ steps.scan.outputs.actionable }}
  files-read:
    description: Files actually opened and scanned. The coverage claim — a repository with no findings and one never scanned both report zero.
    value: ${{ steps.scan.outputs.files_read }}
  lines-truncated:
    description: Lines too long to scan whole. Non-zero means part of the repository was not examined.
    value: ${{ steps.scan.outputs.lines_truncated }}
  ignored:
    description: >-
      Findings the repository excepted in .visiblaze/secrets-ignore.yml. They are still reported and
      still counted here — an exception nobody can see is indistinguishable from a miss — and they
      do not fail the build.
    value: ${{ steps.scan.outputs.ignored }}
  new:
    description: >-
      Credentials this change introduced, measured against the merge base. Meaningless unless
      `classified` is true.
    value: ${{ steps.scan.outputs.new }}
  existing:
    description: Credentials the branch already had. These never fail a build under fail-on-new.
    value: ${{ steps.scan.outputs.existing }}
  classified:
    description: >-
      Whether new-versus-existing could be worked out at all. READ THIS BEFORE `new`: false with
      new=0 means "we could not tell", which must never be rendered the same as "this change
      introduced nothing".
    value: ${{ steps.scan.outputs.classified }}
  blocking-skipped-reason:
    description: >-
      Set when fail-on-new was configured and could not be applied. Empty otherwise. A configured
      gate that did not run is a third outcome, not a pass.
    value: ${{ steps.scan.outputs.blocking_skipped_reason }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        IN_TENANT: ${{ inputs.tenant }}
        IN_API: ${{ inputs.api-url }}
        IN_REPO_KEY: ${{ inputs.repo-key }}
        IN_PATH: ${{ inputs.path }}
        IN_SCOPE: ${{ inputs.scope }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        IN_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        IN_DRY_RUN: ${{ inputs.dry-run }}
        IN_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        ACTION_PATH: ${{ github.action_path }}
        GH_REPO_ID: ${{ github.repository_id }}
        GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GH_WORKSPACE: ${{ github.workspace }}
        GH_EVENT: ${{ github.event_name }}
        GH_REPOSITORY: ${{ github.repository }}
        # The repository the pull request's head lives in. Different from GH_REPOSITORY only for a
        # pull request from a fork, which is the one case GitHub refuses an OIDC token.
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        # The three the baseline needs. All empty on any event that is not a pull request, which is
        # what gates the whole block below.
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN are deliberately NOT declared here.
        #
        # The runner injects them into the job's process environment, which is where the scanner
        # reads them from (os.Getenv). Re-declaring them from the `env` context — which reflects
        # `env:` keys, not runner-injected variables — assigns the empty string when the context
        # does not carry them, OVERWRITING the real inherited values for this step. Best case a
        # no-op, worst case every upload dies with "no OIDC token available". Neither house action
        # declares them.
      run: |
        set -uo pipefail

        # ── Booleans, validated ──
        #
        # These were exact compares against lowercase `true` with no else-branch, so `dry-run: 'True'`
        # -- a plausible YAML typo -- fell through to the REPORTING path and performed a real upload
        # while the author believed nothing was sent. Anything not clearly true or false is refused
        # rather than guessed.
        norm_bool() {
          case "$(printf '%s' "$2" | tr 'A-Z' 'a-z')" in
            true|yes|1|on)   printf 'true'  ;;
            false|no|0|off|"") printf 'false' ;;
            *) echo "::error::visiblaze-secret: ${1} must be true or false, got '${2}'" >&2
               printf 'invalid' ;;
          esac
        }
        DRY_RUN="$(norm_bool dry-run "${IN_DRY_RUN}")"
        FAIL_CLOSED="$(norm_bool fail-on-error "${IN_FAIL_ON_ERROR}")"
        if [ "$DRY_RUN" = "invalid" ] || [ "$FAIL_CLOSED" = "invalid" ]; then
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "delivery-status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        # Every failure path lands here. Default is to WARN and exit 0: a credential scanner that
        # breaks a customer's pipeline because our endpoint is down has made their day worse and
        # their repository no safer. fail-on-error: true opts into the stricter reading.
        bail() {
          local level="$1"; shift
          echo "::${level}::visiblaze-secret: $*"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "delivery-status=failed" >> "$GITHUB_OUTPUT"
          if [ "${FAIL_CLOSED}" = "true" ]; then exit 1; fi
          exit 0
        }

        # fatal() is for INTEGRITY failures, and it ignores fail-on-error.
        #
        # The README promised "a re-tagged release or a replaced artefact changes the digest and the
        # job stops". It did not: a checksum mismatch went through bail(), which on the documented
        # default (fail-on-error: false) prints an annotation and exits 0 — so a substituted binary
        # produced a green check. The binary was indeed not executed, but "the job stops" was false.
        #
        # The distinction is availability vs integrity. Our endpoint being down is our problem and
        # must not break your build. A tampered artefact, an unverifiable pin, an api-url we do not
        # permit, or a scan path outside your checkout are all cases where continuing quietly is
        # worse than failing — and none of them are transient.
        fatal() {
          echo "::error::visiblaze-secret: $*"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "delivery-status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        }

        verify_sha256() {
          local file="$1" expected="$2" actual=""
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$file" | awk '{print $1}')"
          elif command -v shasum >/dev/null 2>&1; then
            actual="$(shasum -a 256 "$file" | awk '{print $1}')"
          else
            fatal "no sha256sum or shasum on this runner — cannot verify a download, so nothing will be executed"
          fi
          # Lowercased both sides: a digest pasted from a release page is often uppercase, and a
          # case mismatch must not read as tampering.
          if [ "$(printf '%s' "$actual" | tr 'A-Z' 'a-z')" != "$(printf '%s' "$expected" | tr 'A-Z' 'a-z')" ]; then
            fatal "checksum mismatch for $(basename "$file") — expected ${expected}, got ${actual}. Nothing was executed. Either the pin is stale or the artefact changed; do not 'fix' this by updating the digest without finding out which."
          fi
        }

        # ── Pins ────────────────────────────────────────────────────────────────────────
        PINS="${ACTION_PATH}/pins.env"
        [ -f "$PINS" ] || fatal "pins.env is missing from the action — refusing to download anything unpinned"
        set -a
        # shellcheck disable=SC1090
        . "$PINS"
        set +a

        # Fails closed on an unpopulated pin. The sentinel is the committed default, so an action
        # published before its pins were filled cannot run rather than running unverified.
        for required in SCANNER_VERSION SCANNER_BASE_URL; do
          val="$(eval "printf '%s' \"\${${required}:-}\"")"
          case "$val" in
            ''|UNSET) fatal "${required} is unset in pins.env — this action will not run without a pinned release" ;;
          esac
        done

        case "$(uname -m)" in
          x86_64|amd64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) bail error "unsupported runner architecture $(uname -m); Visiblaze publishes linux/amd64 and linux/arm64" ;;
        esac
        if [ "$(uname -s)" != "Linux" ]; then
          bail error "unsupported runner OS $(uname -s); Visiblaze publishes Linux builds only"
        fi

        case "$ARCH" in
          amd64) EXPECTED="${SCANNER_SHA256_LINUX_AMD64:-}" ;;
          arm64) EXPECTED="${SCANNER_SHA256_LINUX_ARM64:-}" ;;
        esac
        # Refused rather than falling back to the release's checksums.txt. A missing pin is the one
        # condition under which a fallback would silently restore exactly the weakness this
        # replaced, on a run that otherwise looks identical.
        case "${EXPECTED}" in
          ''|UNSET) fatal "pins.env carries no scanner digest for ${ARCH} — refusing to run a scanner this action commit does not pin" ;;
        esac

        # ── The API origin ──────────────────────────────────────────────────────────────
        #
        # Checked here, in readable shell, rather than inside the binary: the guarantee that
        # findings can only reach a Visiblaze endpoint is one a reviewer can verify by reading this
        # file instead of taking a compiled artefact on trust.
        case "$IN_API" in
          https://*) ;;
          *) fatal "api-url must be https, got '${IN_API}'" ;;
        esac
        API_ORIGIN="$(printf '%s' "$IN_API" | awk -F/ '{print $1"//"$3}')"
        API_OK=""
        # Distinguished from "your origin is not listed" because the fix is different, and because
        # an unquoted multi-origin pins.env produces exactly this state (see pins.env).
        [ -n "${ALLOWED_API_ORIGINS:-}" ] || fatal "pins.env set no allowed origins — the file is truncated, mis-sourced, or has an unquoted multi-value ALLOWED_API_ORIGINS. Refusing to send anything."
        for ORIGIN in ${ALLOWED_API_ORIGINS:-}; do
          if [ "$API_ORIGIN" = "$ORIGIN" ]; then API_OK="yes"; break; fi
        done
        # No allowlist at all is refused rather than treated as "anything goes". An empty variable
        # is what a truncated or mis-sourced pins.env looks like, and defaulting it open would turn
        # a broken file into a silent removal of this check.
        [ -n "$API_OK" ] || fatal "api-url origin ${API_ORIGIN} is not one this action permits — findings may only be sent to a Visiblaze endpoint listed in pins.env"

        # ── The scan path must stay inside the checkout ─────────────────────────────────
        #
        # Otherwise `path: ../..` would walk the runner's filesystem — including other jobs'
        # checkouts and the runner's own credentials — and report what it found there as this
        # repository's leaked secrets.
        TARGET="$(cd "${GH_WORKSPACE}" 2>/dev/null && cd "${IN_PATH}" 2>/dev/null && pwd -P)" || \
          fatal "path '${IN_PATH}' does not exist inside the checkout"
        WSREAL="$(cd "${GH_WORKSPACE}" && pwd -P)"
        case "$TARGET" in
          "$WSREAL"|"$WSREAL"/*) ;;
          *) fatal "path '${IN_PATH}' resolves outside the checkout (${TARGET}); refusing to scan it" ;;
        esac

        WORK="$(mktemp -d)"
        # Composite actions have no post step, so the trap is the cleanup. On a self-hosted runner
        # the checkout persists between jobs, and the merge-base worktree and the ref fetched for it
        # would otherwise pile up there run after run.
        cleanup() {
          if [ -n "${BASE_WORKTREE:-}" ]; then
            git -C "${GH_WORKSPACE}" worktree remove --force "${BASE_WORKTREE}" >/dev/null 2>&1 || true
            git -C "${GH_WORKSPACE}" worktree prune >/dev/null 2>&1 || true
          fi
          if [ -n "${BASE_REF_FETCHED:-}" ]; then
            git -C "${GH_WORKSPACE}" update-ref -d refs/visiblaze/secretbase >/dev/null 2>&1 || true
          fi
          rm -rf "$WORK"
        }
        trap cleanup EXIT

        SCANNER_TGZ="visiblaze-secret-scan_${SCANNER_VERSION}_linux_${ARCH}.tar.gz"
        BASE="${SCANNER_BASE_URL%/}/${SCANNER_VERSION}"
        echo "visiblaze-secret: fetching scanner ${SCANNER_VERSION} (${ARCH})"
        if ! curl -fsSL --retry 3 --retry-connrefused -o "${WORK}/${SCANNER_TGZ}" "${BASE}/${SCANNER_TGZ}"; then
          bail error "could not download ${SCANNER_TGZ} from ${BASE}"
        fi
        verify_sha256 "${WORK}/${SCANNER_TGZ}" "$EXPECTED"

        # ── Provenance, on top of the digest ────────────────────────────────────────────
        #
        # The digest says these are the bytes this action commit names. The Sigstore signature says
        # OUR release workflow built them, so a digest recorded in error still cannot point at bytes
        # we never released. Required once pins.env says the release is signed. Every failure of
        # the check itself is fatal; only a download that will not download is a bail().
        #
        # NETWORK: keyless verification reads Sigstore's trust root. A runner behind a
        # TLS-intercepting proxy may be refused; the answer is to let sigstore.dev through
        # unintercepted, never to skip this.
        if [ "${SCANNER_SIGNED:-false}" = "true" ]; then
          case "$ARCH" in
            amd64) COSIGN_URL="${COSIGN_URL_LINUX_AMD64:-}"; COSIGN_SHA="${COSIGN_SHA256_LINUX_AMD64:-}" ;;
            arm64) COSIGN_URL="${COSIGN_URL_LINUX_ARM64:-}"; COSIGN_SHA="${COSIGN_SHA256_LINUX_ARM64:-}" ;;
          esac
          for pair in "COSIGN_URL=${COSIGN_URL}" "COSIGN_SHA256=${COSIGN_SHA}" \
                      "SCANNER_CERT_IDENTITY_REGEXP=${SCANNER_CERT_IDENTITY_REGEXP:-}" \
                      "SCANNER_CERT_OIDC_ISSUER=${SCANNER_CERT_OIDC_ISSUER:-}"; do
            case "${pair#*=}" in
              ''|UNSET) fatal "${pair%%=*} is not pinned in pins.env. Signature verification cannot be skipped by leaving it blank." ;;
            esac
          done
          if ! curl -fsSL --retry 3 --retry-connrefused -o "${WORK}/cosign" "${COSIGN_URL}"; then
            bail error "could not download cosign from ${COSIGN_URL} — the scanner's signature cannot be checked, so nothing will be executed"
          fi
          verify_sha256 "${WORK}/cosign" "${COSIGN_SHA}"
          chmod +x "${WORK}/cosign"
          if ! curl -fsSL --retry 3 --retry-connrefused -o "${WORK}/${SCANNER_TGZ}.sigstore.json" "${BASE}/${SCANNER_TGZ}.sigstore.json"; then
            bail error "could not download the signature bundle for ${SCANNER_TGZ} — refusing to run an unverified scanner"
          fi
          if ! "${WORK}/cosign" verify-blob \
                --bundle "${WORK}/${SCANNER_TGZ}.sigstore.json" \
                --certificate-identity-regexp "${SCANNER_CERT_IDENTITY_REGEXP}" \
                --certificate-oidc-issuer "${SCANNER_CERT_OIDC_ISSUER}" \
                "${WORK}/${SCANNER_TGZ}" >/dev/null 2>&1; then
            fatal "visiblaze-secret-scan signature verification FAILED: the digest matched but the archive was not signed by the Visiblaze release workflow (${SCANNER_CERT_IDENTITY_REGEXP}). Do not proceed by relaxing this check."
          fi
          echo "visiblaze-secret: scanner signature verified (Visiblaze release workflow)"
        fi

        if ! tar -xzf "${WORK}/${SCANNER_TGZ}" -C "${WORK}"; then
          bail error "could not extract ${SCANNER_TGZ}"
        fi
        [ -f "${WORK}/visiblaze-secret-scan" ] || fatal "${SCANNER_TGZ} did not contain visiblaze-secret-scan"
        chmod +x "${WORK}/visiblaze-secret-scan"

        # ── Arguments ───────────────────────────────────────────────────────────────────
        REPO_KEY="${IN_REPO_KEY}"
        [ -n "$REPO_KEY" ] || REPO_KEY="github#${GH_REPO_ID}"

        ARGS=(
          -dir "$TARGET"
          -repo-key "$REPO_KEY"
          -ref "$GH_REF_NAME"
          -commit "$GH_SHA"
          -tenant "$IN_TENANT"
          -producer runner
        )
        [ -n "${IN_SCOPE}" ] && ARGS+=(-scope "${IN_SCOPE}")
        [ -n "${IN_FAIL_ON}" ] && ARGS+=(-fail-on "${IN_FAIL_ON}")
        [ -n "${IN_FAIL_ON_NEW:-}" ] && ARGS+=(-fail-on-new "${IN_FAIL_ON_NEW:-}")
        # A real output contract, not a declared one.
        #
        # `outputs.findings` was wired to steps.scan.outputs.findings and nothing ever wrote it, so
        # it was permanently the empty string — and `if: steps.x.outputs.findings != '0'` reads an
        # empty string as "not zero", i.e. a gate that fires always. The scanner writes the counts
        # to a file precisely so this wrapper does not have to scrape its log.
        SUMMARY="${WORK}/summary.env"
        ARGS+=(-summary-file "$SUMMARY")
        ARGS+=(-api "$IN_API")
        [ -n "${GH_EVENT:-}" ] && ARGS+=(-event "${GH_EVENT:-}")

        # ── The merge base, on a pull request ────────────────────────────────────────────
        #
        # Without it the platform has nothing to compare against and reports "no baseline,
        # nothing was compared" for every pull request — and every credential the branch
        # ALREADY had reads as one this change introduced.
        #
        # Every failure below is NON-FATAL and lands in the same place: no baseline, so nothing is
        # called new. A repository we cannot build a baseline for must not have its builds fail
        # over our inability to build one.
        #
        # Feature-detected, because action.yml and pins.env move independently and the scanner
        # rejects an unknown flag outright. An action newer than its pin would otherwise fail every
        # pull request with "flag provided but not defined".
        # Captured, then matched. NOT piped into `grep -q`.
        #
        # `grep -q` exits at the first match, the binary keeps writing usage lines, and it takes
        # SIGPIPE — which `set -o pipefail` at the top of this script turns into a failed pipeline
        # even though grep DID match. The baseline is then silently never requested, and the check
        # reports "nothing was compared" on a run that should have had a baseline.
        #
        # Measured before the fix: 164 detections out of 200 identical invocations. Roughly one
        # pull request in six, non-deterministically, with no error anywhere — found because it
        # made a test flaky rather than because anything failed.
        SUPPORTS_BASELINE=""
        HELP_OUT="$("${WORK}/visiblaze-secret-scan" -h 2>&1 || true)"
        case "$HELP_OUT" in
          *-base-dir*) SUPPORTS_BASELINE="yes" ;;
        esac

        if [ -n "${BASE_SHA:-}" ] && [ "${DRY_RUN}" != "true" ] && [ -n "${SUPPORTS_BASELINE}" ]; then
          BASE_WORKTREE="${WORK}/base"
          if git -C "${GH_WORKSPACE}" rev-parse --git-dir >/dev/null 2>&1; then
            # A pull-request checkout is shallow — actions/checkout defaults to fetch-depth 1 — and
            # a merge base cannot be computed from one commit on each side. Deepened here rather
            # than by asking you to change your checkout: a scanner that needs fetch-depth 0 to work
            # is one that silently does less for everyone who did not read that far.
            #
            # Each error is CAPTURED, not discarded, so the message below can say which of four
            # causes it was.
            GITERR=""
            BASE_REF_FETCHED="yes"
            if ! git -C "${GH_WORKSPACE}" fetch --no-tags --quiet --depth=200 \
                   origin "+${BASE_SHA:-}:refs/visiblaze/secretbase" 2>"${WORK}/git.err"; then
              GITERR="$(tr -d '\r' < "${WORK}/git.err" | tail -1)"
              # A server that will not serve an arbitrary SHA still serves the branch it is on.
              if git -C "${GH_WORKSPACE}" fetch --no-tags --quiet --depth=200 \
                     origin "${BASE_REF:-}" 2>"${WORK}/git.err"; then
                GITERR=""
              else
                GITERR="$(tr -d '\r' < "${WORK}/git.err" | tail -1)"
              fi
            fi
            # Deepen the HEAD side too, or the two histories still never meet.
            git -C "${GH_WORKSPACE}" fetch --no-tags --quiet --deepen=200 2>/dev/null || true

            # Merge-base the PULL REQUEST'S HEAD against the base tip, never the checked-out HEAD.
            #
            # On a pull_request event the workspace is at refs/pull/N/merge, and the base tip is
            # that merge commit's FIRST PARENT — so `merge-base HEAD "${BASE_SHA}"` returns
            # BASE_SHA itself. Not an error, just the wrong commit: the base branch TIP rather than
            # the fork point. That attributes to this pull request every credential that landed on
            # the base branch since it was cut, and stores the baseline under a sha the platform
            # never reads — it looks the base side up at GitHub's own merge base of
            # (base tip, pull request head).
            #
            # HEAD^2 is the pull request's head on a merge-ref checkout and needs no fetch, so it is
            # the fallback when the event payload is absent.
            MB_HEAD="${PR_HEAD_SHA:-}"
            [ -z "${MB_HEAD}" ] && MB_HEAD="$(git -C "${GH_WORKSPACE}" rev-parse --verify --quiet 'HEAD^2' 2>/dev/null || true)"
            [ -z "${MB_HEAD}" ] && MB_HEAD="HEAD"
            MERGE_BASE="$(git -C "${GH_WORKSPACE}" merge-base "${MB_HEAD}" "${BASE_SHA:-}" 2>"${WORK}/git.err" || true)"
            if [ -z "${MERGE_BASE}" ]; then
              # Weaker than a true merge base — it can call a credential new that was removed from
              # the base since this branch was cut — so it is a fallback, only reached when the
              # histories genuinely will not meet.
              MERGE_BASE="$(git -C "${GH_WORKSPACE}" rev-parse --verify --quiet 'HEAD^1' 2>/dev/null || true)"
              [ -n "${MERGE_BASE}" ] && echo "visiblaze-secret: no common history with the base; comparing against the merge commit's base parent instead"
            fi
            [ -z "${MERGE_BASE}" ] && [ -z "${GITERR}" ] && GITERR="$(tr -d '\r' < "${WORK}/git.err" | tail -1)"

            if [ -n "${MERGE_BASE}" ] \
               && git -C "${GH_WORKSPACE}" worktree add --detach --quiet "${BASE_WORKTREE}" "${MERGE_BASE}" 2>/dev/null; then
              # The baseline must be the SAME SUBTREE, or a monorepo job comparing its package
              # against the whole repository would call every credential outside its package "new".
              BASE_SCAN_DIR="${BASE_WORKTREE}${TARGET#${WSREAL}}"
              if [ -d "${BASE_SCAN_DIR}" ]; then
                echo "visiblaze-secret: comparing against merge base ${MERGE_BASE}"
                ARGS+=(-base-dir "${BASE_SCAN_DIR}" -base-sha "${MERGE_BASE}")
                [ -n "${BASE_REF:-}" ] && ARGS+=(-base-ref "${BASE_REF:-}")
                # Every commit of the pull request, not only its head: a credential committed and
                # removed again within it is still in the history and must be rotated (SCRUM-18814).
                # Only with a scanner that knows the flag, so an older pinned scanner keeps working.
                case "$HELP_OUT" in
                  *-history-head*)
                    HIST_HEAD="$(git -C "${GH_WORKSPACE}" rev-parse --verify --quiet "${MB_HEAD}^{commit}" 2>/dev/null || true)"
                    [ -n "${HIST_HEAD}" ] && ARGS+=(-history-head "${HIST_HEAD}")
                    ;;
                esac
              else
                # The path did not exist on the base — a newly added subtree. Everything in it is
                # genuinely new, but saying so from an empty baseline is a guess dressed as a
                # measurement.
                echo "visiblaze-secret: '${IN_PATH}' does not exist at the merge base, so this is a new subtree; nothing will be called inherited"
              fi
            else
              echo "visiblaze-secret: could not resolve a merge base, so no credential can be shown to be new${GITERR:+ (git: ${GITERR})}"
            fi
          else
            echo "visiblaze-secret: no git history available, so no credential can be shown to be new"
          fi
        fi
        if [ "${DRY_RUN}" = "true" ]; then
          ARGS+=(-dry-run)
        fi
        # Feature-detected: a pinned scanner older than -sarif-out would reject the flag and fail the run.
        if [ -n "${IN_SARIF_OUTPUT:-}" ]; then
          case "${IN_SARIF_OUTPUT}" in
            /*|*..*) fatal "sarif-output '${IN_SARIF_OUTPUT}' must be a relative path inside the workspace" ;;
          esac
          # The string check does not stop a symlink committed in the pull request: the directory is
          # resolved and must stay in the checkout, and a symlink at the file's own name is refused
          # here and again by the scanner, which never writes through one.
          SARIF_PARENT="$(dirname "${GH_WORKSPACE}/${IN_SARIF_OUTPUT}")"
          if [ -d "${SARIF_PARENT}" ]; then
            SARIF_PARENT_REAL="$(cd "${SARIF_PARENT}" && pwd -P)"
            case "${SARIF_PARENT_REAL}" in
              "${WSREAL}"|"${WSREAL}"/*) ;;
              *) fatal "sarif-output '${IN_SARIF_OUTPUT}' resolves to ${SARIF_PARENT_REAL}, outside the checkout — refusing to write there" ;;
            esac
          fi
          if [ -L "${GH_WORKSPACE}/${IN_SARIF_OUTPUT}" ]; then
            fatal "sarif-output '${IN_SARIF_OUTPUT}' is a symlink in the checkout — refusing to write through it"
          fi
          case "$HELP_OUT" in
            *-sarif-out*) ARGS+=(-sarif-out "${GH_WORKSPACE}/${IN_SARIF_OUTPUT}") ;;
            *) echo "::warning::visiblaze-secret: this scanner cannot write SARIF; re-pin to a newer scanner to use sarif-output" ;;
          esac
        fi

        # The scanner mints its own GitHub OIDC token, for an audience bound to the credential
        # ingest route. Nothing is stored in your repository secrets, so there is nothing to
        # rotate and nothing to leak. The job must grant `id-token: write`.
        #
        # No token at all is not always a mistake. GitHub gives a pull request from a FORK no OIDC
        # token, whatever the workflow asks for, so for that event the scan still runs here and
        # fail-on / fail-on-new are still enforced — the step can still go red on a committed key —
        # and nothing is uploaded. Anywhere else a missing token is the missing permission, and it
        # stays an error.
        LOCAL_ONLY=""
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ "${DRY_RUN}" != "true" ]; then
          if [ "${GH_EVENT:-}" = "pull_request" ] && [ -n "${PR_HEAD_REPO:-}" ] && [ "${PR_HEAD_REPO}" != "${GH_REPOSITORY:-}" ]; then
            LOCAL_ONLY="yes"
            echo "::warning::visiblaze-secret: this pull request comes from a fork (${PR_HEAD_REPO}), and GitHub issues no OIDC token to fork pull requests. Scanned on this runner and fail-on enforced; nothing was sent to Visiblaze."
            ARGS+=(-dry-run)
          else
            bail error "no OIDC token available — add 'permissions: { id-token: write }' to this job"
          fi
        fi

        set +e
        "${WORK}/visiblaze-secret-scan" "${ARGS[@]}"
        rc=$?
        set -e

        # Published whatever the exit code, including a policy failure and a failed upload: a
        # consumer that only learns the counts on success cannot report on the runs that matter.
        if [ -f "$SUMMARY" ]; then
          cat "$SUMMARY" >> "$GITHUB_OUTPUT"
        else
          # Explicitly zero-ish rather than absent, so a consumer never reads an empty string as a
          # number. status= tells them whether to trust it.
          # Every key a consumer may read, or `outputs.classified` is the empty string and
          # `if: steps.scan.outputs.classified != 'true'` silently reads as "not classified" for a
          # run that simply had no summary — the same empty-string-is-truthy trap the comment above
          # this block was written about.
          printf 'findings=\nactionable=\nignored=\nnew=\nexisting=\nclassified=false\n' >> "$GITHUB_OUTPUT"
        fi

        # DELIVERY is the `delivery-status` value for every path that got as far as running the
        # scanner. `status` keeps saying `complete`, which is the value workflows branch on today
        # and therefore cannot move; this is the same fact in the vocabulary visiblaze-sast uses,
        # and it carries the dry-run/real distinction `complete` throws away.
        #
        # Honest about one limit: on exit 2 the scanner evaluates the policy even when the upload
        # failed, so `sent` here means "a real (non-dry) run reached the upload", not "the platform
        # acknowledged it". visiblaze-sast's `status` has always had the same imprecision on the
        # same path, and matching it beats inventing a fourth reading — the wrapper cannot tell
        # without scraping the scanner's log, which is the contract nobody declared.
        if [ "${DRY_RUN}" = "true" ]; then DELIVERY="dry-run"; else DELIVERY="sent"; fi
        # A fork pull request was scanned and gated here, and delivered nothing.
        if [ -n "${LOCAL_ONLY}" ]; then DELIVERY="failed"; fi

        # Exit 2 is the scanner's policy verdict. That is YOUR result and it is reported as-is,
        # regardless of fail-on-error, which governs only whether OUR failures break your build.
        if [ "$rc" -eq 2 ]; then
          echo "status=complete" >> "$GITHUB_OUTPUT"
          echo "delivery-status=${DELIVERY}" >> "$GITHUB_OUTPUT"
          echo "policy=fail" >> "$GITHUB_OUTPUT"
          # Exit 2 has three possible deciders: this step's `fail-on`, its `fail-on-new`, and your
          # organisation's pull-request policy, which the platform returns with the upload. The
          # message names the ones that could have fired. With neither input set only the
          # organisation's policy can have blocked; it was once reported as "at or above ." - an
          # empty threshold, blamed on the wrong decider, in the one line GitHub shows on the pull
          # request. The scanner's log above names the credentials and the rule that blocked.
          DECIDERS=""
          [ -n "${IN_FAIL_ON}" ] && DECIDERS="fail-on '${IN_FAIL_ON}'"
          [ -n "${IN_FAIL_ON_NEW:-}" ] && DECIDERS="${DECIDERS:+${DECIDERS} or }fail-on-new '${IN_FAIL_ON_NEW}'"
          ROTATE="Rotate them at the issuer, then purge them from history — deleting the line does not revoke the key."
          if [ -z "${DECIDERS}" ]; then
            echo "::error::visiblaze-secret: this change introduced credentials your organisation's pull-request policy blocks on — the run log names them and the rule that blocked. ${ROTATE}"
          elif [ "${DRY_RUN}" = "true" ] || [ -n "${LOCAL_ONLY}" ]; then
            # Nothing was uploaded, so no organisation policy came back: the inputs decided.
            echo "::error::visiblaze-secret: credentials met ${DECIDERS}. ${ROTATE}"
          else
            echo "::error::visiblaze-secret: credentials met ${DECIDERS}, or your organisation's pull-request policy — the run log says which. ${ROTATE}"
          fi
          exit 2
        fi
        if [ "$rc" -ne 0 ]; then
          # No `policy` is written here, deliberately, and visiblaze-sast does the same: the scan
          # did not reach a verdict, so there is no verdict to report. An absent output reads as an
          # empty string, which is not `pass` — the description says to check `status` first.
          bail error "the scan did not complete (exit ${rc})"
        fi
        echo "status=complete" >> "$GITHUB_OUTPUT"
        echo "delivery-status=${DELIVERY}" >> "$GITHUB_OUTPUT"
        # rc 0 with a threshold set means the threshold was evaluated and not met. It cannot mean
        # "the threshold was junk and was ignored": the scanner refuses an unrecognised -fail-on
        # with exit 1, so `fail-on: severe` never reaches this line.
        #
        # fail-on-new is the same policy measured against the merge base, and it counts as applied
        # only when the scanner could classify new versus existing. When it could not, the gate did
        # not run - that is `not-applied`, with blocking-skipped-reason saying why - never `pass`.
        SKIPPED_WHY=""
        CLASSIFIED=""
        if [ -f "$SUMMARY" ]; then
          # `|| true`: `set -e` is back in force here, and a key the summary does not carry is an
          # answer (empty), not a reason to abort the step.
          SKIPPED_WHY="$(grep '^blocking_skipped_reason=' "$SUMMARY" | tail -1 | cut -d= -f2- || true)"
          CLASSIFIED="$(grep '^classified=' "$SUMMARY" | tail -1 | cut -d= -f2- || true)"
        fi
        if [ -n "${IN_FAIL_ON}" ]; then
          echo "policy=pass" >> "$GITHUB_OUTPUT"
        elif [ -n "${IN_FAIL_ON_NEW:-}" ] && [ "${CLASSIFIED}" = "true" ] && [ -z "${SKIPPED_WHY}" ]; then
          echo "policy=pass" >> "$GITHUB_OUTPUT"
        else
          echo "policy=not-applied" >> "$GITHUB_OUTPUT"
        fi
